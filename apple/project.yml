name: Forge
options:
  bundleIdPrefix: com.forgeit
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    # XcodeGen regenerates Info.plist from these properties (plus the standard
    # CFBundle* keys) on every `xcodegen generate`, so custom keys must live
    # here, not only in the .plist file — anything only in the file is wiped.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Forge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgeit.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    dependencies:
      - target: ForgeWatch
        embed: true

  ForgeWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchOS
      - path: Shared
    info:
      path: WatchOS/Info.plist
      properties:
        CFBundleDisplayName: Forge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.forgeit.app
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgeit.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "NO"
