name: Forge
options:
  bundleIdPrefix: com.forgeit
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    info:
      path: iOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgeit.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    dependencies:
      - target: ForgeWatch
        embed: true

  ForgeWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchOS
      - path: Shared
    info:
      path: WatchOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgeit.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "NO"
